name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same pull request supersedes its older run; main runs every push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each shard keeps Playwright's default two workers; timing-sensitive
        # tests stay as reliable as before while the shards run side by side.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Playwright serves this dist/ directly on CI instead of rebuilding it.
      - run: pnpm build
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
